name: Test build

on:
  workflow_dispatch:  # manual
  push:
    branches: [ release, dev ]
  pull_request:
    branches: [ release, dev ]

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:

  testsuite:

    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]  # ubuntu takes too long to install extras
        python-version: ['3.10']

    steps:
    - uses: actions/checkout@v3
    - uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}
        
    - name: Install UV
      uses: astral-sh/setup-uv@v7
      with:
        activate-environment: true
        enable-cache: true

    - name: Checkout PsychoPy (lib)
      uses: actions/checkout@v3
      with:
        repository: psychopy/psychopy
        ref: dev
        path: pp
    
    - name: get_month
      if: runner.os=='Linux'
      id: month
      run: echo "month=$(date +'%Y-%m')" >> "$GITHUB_OUTPUT"
  
    - name: cache wxPython for linux
      if: runner.os=='Linux'
      uses: actions/cache@v3
      with:
        path: ~/.cache/pip
        key: ${{ matrix.os }}-py${{ matrix.python-version }}-${{ steps.month.outputs.month }}
        
    - name: Install Linux system dependencies
      if: runner.os=='Linux'
      run: |
        # mostly for wxPython, some for xvfb (virtual display)
        sudo apt-get update
        sudo apt-get install -y -qq python3-dev libgtk-3-dev
        sudo apt-get install -y -qq libgstreamer1.0-0 gstreamer1.0-plugins-base
        sudo apt-get install -y -qq libwebkit2gtk-4.1-dev
        sudo apt-get install -y -qq libpng-dev libjpeg-dev libtiff-dev libnotify-dev libsm-dev
        sudo apt-get install -y -qq libsdl2-dev libsdl2-mixer-2.0-0 libsdl2-image-2.0-0 libsdl2-2.0-0
        sudo apt-get install -y -qq libportaudio2
        # virtual frame buffer
        sudo apt install llvm-18-dev  # for xvfb
        sudo apt install xvfb xauth libgl1-mesa-dri

        # set up fake sound device?
        # sudo apt-get install -y -qq libasound2-dev alsa-utils alsa-oss
        # sudo apt-get install -y linux-modules-extra-$(uname -r)  # needed for modprobe snd-dummy
        # sudo sh .github/workflows/prep_dummy_soundcard.sh  # couldn't find that file

        # for PyQt:
        sudo apt-get install -y -qq libdbus-1-3
        sudo apt-get install -y -qq '^libxcb.*-dev' libx11-xcb-dev libglu1-mesa-dev libxrender-dev libxi-dev libxkbcommon-dev libxkbcommon-x11-dev
        export LIBGL_ALWAYS_INDIRECT=0
        export QT_DEBUG_PLUGINS=1 # let us know about missing dependencies?
    
    - name: Install PsychoPy (lib)
      run: |
        uv python install
        # if runner is ubuntu
        if [ "${{ matrix.os }}" == "ubuntu-latest" ]; then
          uv pip install -f https://extras.wxpython.org/wxPython4/extras/linux/gtk3/ubuntu-24.04 wxPython
        fi
        uv pip install pp/. --all-extras -r pp/pyproject.toml

    - name: Install PsychoPy App
      run: |
        # then install rest of dependencies and the app itself
        uv pip install .

    - name: Build PsychoPy App
      run: |
        uv build --sdist --wheel

    - name: Try to run the app!
      run: |
        if [ "${{ runner.os }}" == "Linux" ]; then
          xvfb-run --auto-servernum --server-args="-screen 0 1024x768x24" pytest -rP tests # including passed tests in report
        else
          pytest -rP tests # including passed tests in report
        fi